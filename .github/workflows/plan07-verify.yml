name: Plan07 Verify

on:
  workflow_dispatch:
  push:
    branches:
      - "cursor/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: plan07-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and workflow tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint
