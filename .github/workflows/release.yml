name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: electron:pack:linux
          - os: windows-latest
            script: electron:pack:win
          - os: macos-14
            script: electron:pack:mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run ${{ matrix.script }}
        env:
          # unsigned mac builds for open-source release
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*portable*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-binaries
          merge-multiple: true

      - name: List binaries
        run: find dist-binaries -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MedPrism ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist-binaries/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
